<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
</head>
<body>
    <h1>Contact Us</h1>
    <p>If you have any questions, feel free to reach out to us!</p>
    <h2>Contact Information</h2>
    <ul>
        <li><strong>Company Name:</strong> PrimeWay Global Enterprises</li>
        <li><strong>Email:</strong> contact@primewayglobal.com</li>
        <li><strong>Phone:</strong> +1 (234) 567-8901</li>
        <li><strong>Address:</strong> 123 Prime Way, City, Country</li>
    </ul>
    <h2>Contact Form</h2>
    <form action="/submit_form" method="POST">
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>
        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="4" required></textarea><br><br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
